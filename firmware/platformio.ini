; PlatformIO Project Configuration File
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- PSRAM configuration for N16R8 (16MB flash + 8MB Octal PSRAM) ---
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1   ; needed for Serial prints over native USB on some S3 boards

; --- v3 CHANGE: ADS1X15 library removed — bioelectric/soil now read on
; direct ESP32 ADC pins (GPIO2, GPIO1), not through the ADS1115.
; DHT sensor library kept (works for both DHT11 and DHT22 — DHT_TYPE in
; main.cpp now set to DHT11 to match actual hardware).
lib_deps =
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit Unified Sensor
    olikraus/U8g2
    bblanchon/ArduinoJson
    adafruit/DHT sensor library