; PlatformIO Project Configuration File
; Board variant: ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM)
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Flash and memory for N16R8 ---
; The board default is 8 MB flash, so override it explicitly.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
; Octal PSRAM (8 MB). The firmware does not allocate from PSRAM yet.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1   ; needed for Serial over native USB on S3 boards

; OLED removed (U8g2 dropped). ADS1X15 not used: bioelectric and soil are read on
; direct ESP32 ADC pins (GPIO2, GPIO1).
; DHT sensor library works for both DHT11 and DHT22 (DHT_TYPE in main.cpp = DHT11).
lib_deps =
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson
    adafruit/DHT sensor library