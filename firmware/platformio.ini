; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- PSRAM support for the N8R8 (8MB flash + 8MB PSRAM) board ---
; The board definition we picked is the "No PSRAM" N8 variant, so we
; enable PSRAM manually with these flags.
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; --- Sensor + display + storage libraries ---
; NOTE: BME280 library replaced with BMP280 (BME280 not available locally).
; BMP280 gives temperature + pressure only, so DHT22 is added for humidity.
lib_deps =
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit ADS1X15
    claws/BH1750
    olikraus/U8g2
    bblanchon/ArduinoJson
    adafruit/DHT sensor library
    ; SD (via SPI) and SD_MMC are bundled with the ESP32 Arduino core —
    ; no extra lib_deps entry needed, just #include <SD.h> and <SPI.h>